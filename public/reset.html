<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password — Good People</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/home.css">
</head>
<body class="home-login-open password-reset-page">
    <div class="home-login-overlay" aria-hidden="false">
        <div class="home-login-backdrop"></div>
        <div class="home-login-panel" role="dialog" aria-modal="true" aria-label="Reset password">
            <h2 class="home-signup-title">Reset password</h2>
            <p id="reset-email-hint" class="home-signup-field-hint" hidden></p>
            <form id="password-reset-form" class="home-signup-form" novalidate>
                <label class="home-signup-label" for="reset-password">New password</label>
                <input type="password" id="reset-password" class="home-signup-input" autocomplete="new-password" minlength="6" required>

                <label class="home-signup-label" for="reset-password-confirm">Confirm password</label>
                <input type="password" id="reset-password-confirm" class="home-signup-input" autocomplete="new-password" minlength="6" required>

                <p id="reset-error" class="home-signup-error" hidden></p>
                <p id="reset-success" class="home-signup-success" hidden></p>

                <button type="submit" class="home-auth-btn" id="reset-submit">Save password</button>
                <a class="home-login-create-account" href="/?login=1">Back to sign in</a>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-auth.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/password-reset.js"></script>
</body>
</html>
