    <meta property="og:site_name" content="Good People Posting">
    <meta property="og:title" content="Good People">
    <meta property="og:description" content="Good People Posting — writing drawn from ordinary life.">
    <meta property="og:image" content="https://goodpeople.build/img/og-share.jpg">
    <meta property="og:image:width" content="1200">

    <link rel="icon" href="/favicon.png" type="image/png" sizes="128x128">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">

    <link rel="stylesheet" href="css/blog.css">
    <link rel="stylesheet" href="css/article-prose.css">
    <link rel="stylesheet" href="css/content-refs.css">

<body class="reader-loading">

    <div class="blog">
        <div class="article">
            <h1 class="title"></h1>
            <p class="published"><span>published at - </span></p>
        </div>

        <div id="article-body" class="article-columns"></div>

        <div id="comment-screen" class="comment-block">
            <section class="comment-section">
                <ul id="commentList"></ul>
                <form id="commentForm">
                    <input type="text" id="commentInput" placeholder="so what do you think?" />
                </form>
            </section>
        </div>
    </div>

    <a href="/" class="btn grey reader-nav-wall">Wall</a>
    <a href="/admin" class="btn grey reader-nav-dashboard" id="reader-dashboard-btn" hidden>Dashboard</a>

    <div id="comment-delete-dialog" class="comment-dialog" hidden aria-hidden="true">
        <div class="comment-dialog-backdrop" data-comment-delete-cancel tabindex="-1"></div>
        <div class="comment-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="comment-delete-title">
            <p id="comment-delete-title" class="comment-dialog-title">Delete this comment?</p>
            <div class="comment-dialog-actions">
                <button type="button" class="reply comment-dialog-btn" data-comment-delete-cancel>cancel</button>
                <button type="button" class="reply comment-dialog-btn comment-dialog-btn--danger" data-comment-delete-confirm>delete</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-auth.js"></script>

    <script src="js/firebase.js"></script>
    <script src="js/content-refs.js"></script>
    <script src="js/blog.js"></script>

</body>
</html>
